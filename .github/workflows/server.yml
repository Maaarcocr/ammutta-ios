name: Deploy agent connector
# Deploys server/ to Cloudflare Workers with the cf CLI when it changes on main, or on demand.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, Workers KV Storage: Edit)
# and CLOUDFLARE_ACCOUNT_ID. Without them the job explains what is missing and stops; deploy
# from a computer with `npx cf deploy` instead (docs/agents.md).
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-agent-connector
  cancel-in-progress: false
jobs:
  deploy:
    name: Test and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy from GitHub, or run npx cf deploy locally (docs/agents.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
      - name: Install, type check, test and deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: server
        run: |
          npm ci
          npm run check
          npm test
          npx cf deploy --message "GitHub ${GITHUB_SHA::7}"
